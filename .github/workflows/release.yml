name: Release Windows client

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-client
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      asset_name: ${{ steps.release.outputs.asset_name }}
    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-build.txt

      - name: Install locked build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Validate release metadata
        id: release
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import sys
          sys.path.insert(0, str(Path.cwd()))
          import accounting_flet

          manifest = json.loads(Path('version.json').read_text(encoding='utf-8'))
          version = manifest['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          assert accounting_flet.VERSION == version
          asset_name = f'TextileAccounting_v{version}.exe'
          assert manifest['exe_asset_name'] == asset_name
          assert manifest['changes']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\ntag=v{version}\nasset_name={asset_name}\n')

      - name: Syntax and complete regression tests
        run: |
          python -m compileall -q accounting.py accounting_flet.py accounting_gui.py auto_updater.py import_csv.py import_excel.py receipt_printer.py app_core scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows single-file client
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m flet.cli pack accounting_flet.py --yes --name "TextileAccounting_v${env:APP_VERSION}" --product-name "家纺记账系统" --file-description "家纺四件套记账系统" --product-version "$env:APP_VERSION" --file-version "${env:APP_VERSION}.0" --add-data "receipt_printer.py;." "version.json;." --hidden-import import_excel openpyxl win32print --pyinstaller-build-args=--noupx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify bundled files and Windows client startup
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          python scripts/verify_windows_bundle.py "dist/$env:ASSET_NAME" version.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare release assets and notes
        shell: python
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil

          dist = Path('dist')
          executable = dist / os.environ['ASSET_NAME']
          assert executable.is_file() and executable.stat().st_size > 20_000_000
          shutil.copyfile('version.json', dist / 'version.json')
          files = [executable, dist / 'version.json']
          checksums = []
          for file in files:
              with file.open('rb') as stream:
                  checksums.append(f'{hashlib.file_digest(stream, "sha256").hexdigest()}  {file.name}')
          (dist / 'SHA256SUMS.txt').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          manifest = json.loads(Path('version.json').read_text(encoding='utf-8'))
          notes = '## 更新内容\n\n' + '\n'.join('- ' + change for change in manifest['changes'])
          notes += '\n\n## 升级方式\n\n在旧客户端中进入「系统设置 → 检查更新」，下载后按提示重启。也可退出旧程序后手动下载 EXE。账目保存在独立数据目录，不随程序更新覆盖；重要账目建议先备份。\n'
          notes += '\n## 验证\n\nWindows / Python 3.12 全部自动测试通过；安装包内置版本清单、Flet 运行时及 Windows 版本信息已校验，隔离用户目录中的客户端启动窗口检查通过。未在实际业务电脑与打印机上验证。\n'
          Path('release-notes.md').write_text(notes, encoding='utf-8')

      - name: Save verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-${{ steps.release.outputs.tag }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/${{ steps.release.outputs.asset_name }}
            dist/version.json
            dist/SHA256SUMS.txt
            release-notes.md

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-client-${{ needs.build.outputs.tag }}
          path: release-artifact

      - name: Check uploaded artifact hashes
        working-directory: release-artifact/dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Create draft release after successful build and verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          ASSET_NAME: ${{ needs.build.outputs.asset_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-artifact/dist/$ASSET_NAME" \
            release-artifact/dist/version.json \
            release-artifact/dist/SHA256SUMS.txt \
            --draft --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG - 修复月度统计与版本信息" \
            --notes-file release-artifact/release-notes.md
